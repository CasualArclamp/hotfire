[package]
name = "rocket_sandbox"
version = "0.2.1"
edition = "2024"
description = "Hotfire: build, plumb, light and fly a liquid-fuel rocket engine in a cell-by-cell gas simulation"
license = "GPL-3.0-or-later"
repository = "https://github.com/CasualArclamp/hotfire"
build = "build.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37.0", features = ["wgpu"] }
png = "0.18.1"
pollster = "1.0.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
